
<!DOCTYPE html>
<html>
<head>
    <title>Land & Soil Management</title>
    <style>
        body { margin:0; font-family:Arial,sans-serif; background:#f2f7f2; }
        header { background:#2e7d32; color:white; padding:20px; text-align:center; }
        .container { width:94%; margin:25px auto; }
        .box { background:white; padding:22px; margin-bottom:25px; border-radius:10px; box-shadow:0 2px 8px #ccc; overflow-x:auto; }
        h2 { color:#2e7d32; }
        label { display:block; margin-top:12px; font-weight:bold; }
        input { width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box; }
        button { background:#2e7d32; color:white; border:none; padding:9px 14px; margin:4px; border-radius:5px; cursor:pointer; }
        button:hover { opacity:0.85; }
        .delete { background:#d32f2f; }
        .edit { background:#f57c00; }
        .cancel { background:#555; }
        table { width:100%; border-collapse:collapse; margin-top:15px; background:white; }
        th,td { border:1px solid #ccc; padding:9px; text-align:center; }
        th { background:#2e7d32; color:white; }
        tr:nth-child(even) { background:#f5f5f5; }
        .hidden { display:none; }
        .back { color:#2e7d32; font-weight:bold; text-decoration:none; }
    </style>
</head>
<body>

<header>
    <h1>🌱 Land & Soil Management</h1>
    <p>Farmer Crop Advisory & Market System</p>
</header>

<div class="container">

    <div class="box">
        <h2 id="landTitle">Add Land</h2>
        <form id="landForm">
            <input type="hidden" id="landId">

            <label>Farmer ID</label>
            <input type="number" id="farmerId" required>

            <label>Land Area (acres)</label>
            <input type="number" step="0.01" id="area" required>

            <label>Soil Type</label>
            <input type="text" id="soilType" required>

            <label>Irrigation Facility</label>
            <input type="text" id="irrigation">

            <label>Water Availability</label>
            <input type="text" id="waterAvailability">

            <label>Location</label>
            <input type="text" id="location">

            <label>Temperature (°C)</label>
            <input type="number" step="0.01" id="temperature">

            <button type="submit">Save Land</button>
            <button type="button" id="cancelLandBtn" class="hidden cancel" onclick="cancelLandEdit()">Cancel</button>
        </form>
    </div>

    <div class="box">
        <h2>Registered Land</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th><th>Farmer ID</th><th>Area</th><th>Soil</th>
                    <th>Irrigation</th><th>Water</th><th>Location</th>
                    <th>Temperature</th><th>Actions</th>
                </tr>
            </thead>
            <tbody id="landTable"></tbody>
        </table>
    </div>

    <div class="box">
        <h2 id="soilTitle">Add Soil Test</h2>
        <form id="soilForm">
            <input type="hidden" id="testId">

            <label>Land ID</label>
            <input type="number" id="soilLandId" required>

            <label>Nitrogen</label>
            <input type="number" step="0.01" id="nitrogen">

            <label>Phosphorus</label>
            <input type="number" step="0.01" id="phosphorus">

            <label>Potassium</label>
            <input type="number" step="0.01" id="potassium">

            <label>pH</label>
            <input type="number" step="0.01" id="ph">

            <label>Test Date</label>
            <input type="date" id="testDate" required>

            <button type="submit">Save Soil Test</button>
            <button type="button" id="cancelSoilBtn" class="hidden cancel" onclick="cancelSoilEdit()">Cancel</button>
        </form>
    </div>

    <div class="box">
        <h2>Soil Test Records</h2>
        <table>
            <thead>
                <tr>
                    <th>Test ID</th><th>Land ID</th><th>Nitrogen</th>
                    <th>Phosphorus</th><th>Potassium</th><th>pH</th>
                    <th>Date</th><th>Actions</th>
                </tr>
            </thead>
            <tbody id="soilTable"></tbody>
        </table>
    </div>

    <a class="back" href="/">← Back to Main Menu</a>
</div>

<script>
let lands = [];
let soilTests = [];

async function loadLands() {
    try {
        const response = await fetch("/getLands");
        if (!response.ok) throw new Error("Could not load land records");

        lands = await response.json();
        const table = document.getElementById("landTable");
        table.innerHTML = "";

        lands.forEach(land => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${land.landId ?? ""}</td>
                <td>${land.farmerId ?? ""}</td>
                <td>${land.area ?? ""}</td>
                <td>${land.soilType ?? ""}</td>
                <td>${land.irrigation ?? ""}</td>
                <td>${land.waterAvailability ?? ""}</td>
                <td>${land.location ?? ""}</td>
                <td>${land.temperature ?? ""}</td>
                <td>
                    <button class="edit" onclick="editLand(${Number(land.landId)})">Update</button>
                    <button class="delete" onclick="deleteLand(${Number(land.landId)})">Delete</button>
                </td>`;
            table.appendChild(row);
        });
    } catch (error) {
        console.error(error);
        alert("Error loading land records. Check the Java server.");
    }
}

document.getElementById("landForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const id = document.getElementById("landId").value;
    const data = new URLSearchParams();

    ["farmerId", "area", "soilType", "irrigation", "waterAvailability", "location", "temperature"]
        .forEach(field => data.append(field, document.getElementById(field).value));

    let url = "/addLand";
    if (id) {
        data.append("landId", id);
        url = "/updateLand";
    }

    try {
        const response = await fetch(url, { method:"POST", body:data });
        const message = await response.text();
        alert(message);

        if (!response.ok) return;
        cancelLandEdit();
        loadLands();
    } catch (error) {
        console.error(error);
        alert("Error saving land.");
    }
});

function editLand(id) {
    const land = lands.find(item => Number(item.landId) === Number(id));
    if (!land) return;

    document.getElementById("landId").value = land.landId;
    document.getElementById("farmerId").value = land.farmerId ?? "";
    document.getElementById("area").value = land.area ?? "";
    document.getElementById("soilType").value = land.soilType ?? "";
    document.getElementById("irrigation").value = land.irrigation ?? "";
    document.getElementById("waterAvailability").value = land.waterAvailability ?? "";
    document.getElementById("location").value = land.location ?? "";
    document.getElementById("temperature").value = land.temperature ?? "";
    document.getElementById("landTitle").innerText = "Update Land";
    document.getElementById("cancelLandBtn").classList.remove("hidden");
    window.scrollTo(0, 0);
}

function cancelLandEdit() {
    document.getElementById("landForm").reset();
    document.getElementById("landId").value = "";
    document.getElementById("landTitle").innerText = "Add Land";
    document.getElementById("cancelLandBtn").classList.add("hidden");
}

async function deleteLand(id) {
    if (!confirm("Are you sure you want to delete this land?")) return;

    try {
        const response = await fetch("/deleteLand?id=" + encodeURIComponent(id), { method:"POST" });
        alert(await response.text());
        if (response.ok) loadLands();
    } catch (error) {
        console.error(error);
        alert("Error deleting land.");
    }
}

document.getElementById("soilForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const id = document.getElementById("testId").value;
    const data = new URLSearchParams();

    ["soilLandId", "nitrogen", "phosphorus", "potassium", "ph", "testDate"]
        .forEach(field => {
            const key = field === "soilLandId" ? "landId" :
                        field === "testDate" ? "testDate" : field;
            data.append(key, document.getElementById(field).value);
        });

    let url = "/addSoilTest";
    if (id) {
        data.append("testId", id);
        url = "/updateSoilTest";
    }

    try {
        const response = await fetch(url, { method:"POST", body:data });
        const message = await response.text();
        alert(message);

        if (!response.ok) return;
        cancelSoilEdit();
        loadSoilTests();
    } catch (error) {
        console.error(error);
        alert("Error saving soil test.");
    }
});

async function loadSoilTests() {
    try {
        const response = await fetch("/getSoilTests");
        if (!response.ok) throw new Error("Could not load soil tests");

        soilTests = await response.json();
        const table = document.getElementById("soilTable");
        table.innerHTML = "";

        soilTests.forEach(test => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${test.testId ?? ""}</td>
                <td>${test.landId ?? ""}</td>
                <td>${test.nitrogen ?? ""}</td>
                <td>${test.phosphorus ?? ""}</td>
                <td>${test.potassium ?? ""}</td>
                <td>${test.ph ?? ""}</td>
                <td>${String(test.testDate ?? "").substring(0, 10)}</td>
                <td>
                    <button class="edit" onclick="editSoilTest(${Number(test.testId)})">Update</button>
                    <button class="delete" onclick="deleteSoilTest(${Number(test.testId)})">Delete</button>
                </td>`;
            table.appendChild(row);
        });
    } catch (error) {
        console.error(error);
        alert("Error loading soil tests. Check the Java server.");
    }
}

function editSoilTest(id) {
    const test = soilTests.find(item => Number(item.testId) === Number(id));
    if (!test) return;

    document.getElementById("testId").value = test.testId;
    document.getElementById("soilLandId").value = test.landId ?? "";
    document.getElementById("nitrogen").value = test.nitrogen ?? "";
    document.getElementById("phosphorus").value = test.phosphorus ?? "";
    document.getElementById("potassium").value = test.potassium ?? "";
    document.getElementById("ph").value = test.ph ?? "";
    document.getElementById("testDate").value = String(test.testDate ?? "").substring(0, 10);

    document.getElementById("soilTitle").innerText = "Update Soil Test";
    document.getElementById("cancelSoilBtn").classList.remove("hidden");
    document.getElementById("soilForm").scrollIntoView({ behavior:"smooth" });
}

function cancelSoilEdit() {
    document.getElementById("soilForm").reset();
    document.getElementById("testId").value = "";
    document.getElementById("soilTitle").innerText = "Add Soil Test";
    document.getElementById("cancelSoilBtn").classList.add("hidden");
}

async function deleteSoilTest(id) {
    if (!confirm("Are you sure you want to delete this soil test?")) return;

    try {
        const response = await fetch("/deleteSoilTest?id=" + encodeURIComponent(id), { method:"POST" });
        alert(await response.text());
        if (response.ok) loadSoilTests();
    } catch (error) {
        console.error(error);
        alert("Error deleting soil test.");
    }
}

loadLands();
loadSoilTests();
</script>

</body>
</html>
