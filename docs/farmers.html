<!DOCTYPE html>
<html>

<head>
    <title>Farmer Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f7f2;
            margin: 0;
        }

        header {
            background: #2e7d32;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 92%;
            margin: 30px auto;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input,
        select {
            width: 95%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px 18px;
            margin-top: 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .update-btn {
            background: #f57c00;
            margin: 2px;
        }

        .update-btn:hover {
            background: #e65100;
        }

        .delete-btn {
            background: #d32f2f;
            margin: 2px;
        }

        .delete-btn:hover {
            background: #b71c1c;
        }

        .cancel-btn {
            background: #757575;
            margin-left: 5px;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #2e7d32;
            color: white;
        }

        tr:nth-child(even) {
            background: #f5f5f5;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #2e7d32;
            font-weight: bold;
            text-decoration: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>👨‍🌾 Farmer Registration</h1>
    <p>Farmer Crop Advisory & Market System</p>
</header>

<div class="container">

    <div class="form-box">

        <h2 id="formTitle">Add Farmer</h2>

        <form id="farmerForm">

            <input type="hidden" id="farmerId">

            <label>Farmer Name</label>
            <input type="text" id="name" required>

            <label>Age</label>
            <input type="number" id="age" required>

            <label>Gender</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label>Phone</label>
            <input type="text" id="phone">

            <label>Village</label>
            <input type="text" id="village">

            <label>District</label>
            <input type="text" id="district">

            <label>Land Ownership</label>
            <select id="landOwnership">
                <option value="">Select</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>

            <button type="submit">
                Save Farmer
            </button>
            
            <button
                type="button"
                id="cancelBtn"
                class="cancel-btn hidden"
                onclick="cancelUpdate()">
                Cancel
            </button>

        </form>

    </div>
    <div class="search-box">
    <input
        type="text"
        id="farmerSearch"
        placeholder="Search farmer by name, village, district or phone"
        onkeyup="searchFarmers()"
    >
</div>

    <div class="form-box">

        <h2>Registered Farmers</h2>

        <table>

            <thead>

                <tr>
                    <th>Farmer ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Phone</th>
                    <th>Village</th>
                    <th>District</th>
                    <th>Land Ownership</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="farmerTable">
            </tbody>

        </table>

    </div>
<hr>

<h2>Previous Crop Records</h2>

<form id="previousCropForm">

    <input type="hidden" id="recordId">

    <label>Farmer ID</label>
    <input type="number" id="previousFarmerId" required>

    <label>Land ID</label>
    <input type="number" id="previousLandId" required>

    <label>Crop ID</label>
    <input type="number" id="previousCropId" required>

    <label>Season</label>
    <input type="text" id="previousSeason" placeholder="Kharif" required>

    <label>Year</label>
    <input type="number" id="previousYear" required>

    <label>Yield</label>
    <input type="number" step="0.01" id="previousYield" required>

    <button type="submit">Add Previous Crop</button>

</form>

<br>

<table>
    <thead>
        <tr>
            <th>Record ID</th>
            <th>Farmer ID</th>
            <th>Farmer Name</th>
            <th>Land ID</th>
            <th>Crop ID</th>
            <th>Crop Name</th>
            <th>Season</th>
            <th>Year</th>
            <th>Yield</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody id="previousCropTable">
    </tbody>
</table>

    <a class="back" href="/">
        ← Back to Main Menu
    </a>

</div>


<script>

let farmers = [];


// =====================================
// LOAD FARMERS
// =====================================

async function loadFarmers() {

    try {

        const response =
            await fetch("/getFarmers");

        farmers =
            await response.json();

        const table =
            document.getElementById(
                "farmerTable"
            );

        table.innerHTML = "";

        farmers.forEach(farmer => {

            const row =
                document.createElement("tr");

            row.innerHTML = `

                <td>${farmer.farmerId}</td>

                <td>${farmer.name}</td>

                <td>${farmer.age}</td>

                <td>${farmer.gender}</td>

                <td>${farmer.phone}</td>

                <td>${farmer.village}</td>

                <td>${farmer.district}</td>

                <td>${farmer.landOwnership}</td>

                <td>

                    <button
                        class="update-btn"
                        onclick="editFarmer(${farmer.farmerId})">
                        Update
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteFarmer(${farmer.farmerId})">
                        Delete
                    </button>

                </td>

            `;

            table.appendChild(row);

        });

    } catch (error) {

        console.error(error);

        alert("Error loading farmers.");

    }
}


// =====================================
// ADD / UPDATE FARMER
// =====================================

document.getElementById("farmerForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const farmerId =
                document.getElementById(
                    "farmerId"
                ).value;

            const data =
                new URLSearchParams();

            data.append(
                "name",
                document.getElementById(
                    "name"
                ).value
            );

            data.append(
                "age",
                document.getElementById(
                    "age"
                ).value
            );

            data.append(
                "gender",
                document.getElementById(
                    "gender"
                ).value
            );

            data.append(
                "phone",
                document.getElementById(
                    "phone"
                ).value
            );

            data.append(
                "village",
                document.getElementById(
                    "village"
                ).value
            );

            data.append(
                "district",
                document.getElementById(
                    "district"
                ).value
            );

            data.append(
                "landOwnership",
                document.getElementById(
                    "landOwnership"
                ).value
            );


            let url = "/addFarmer";


            if (farmerId) {

                data.append(
                    "farmerId",
                    farmerId
                );

                url = "/updateFarmer";
            }


            try {

                const response =
                    await fetch(
                        url,
                        {
                            method: "POST",
                            body: data
                        }
                    );

                const result =
                    await response.text();

                alert(result);

                document
                    .getElementById(
                        "farmerForm"
                    )
                    .reset();

                document
                    .getElementById(
                        "farmerId"
                    )
                    .value = "";

                document
                    .getElementById(
                        "formTitle"
                    )
                    .innerText =
                    "Add Farmer";

                document
                    .getElementById(
                        "cancelBtn"
                    )
                    .classList.add(
                        "hidden"
                    );

                loadFarmers();

            } catch (error) {

                console.error(error);

                alert(
                    "Error saving farmer."
                );
            }

        }
    );


// =====================================
// EDIT FARMER
// =====================================

function editFarmer(id) {

    const farmer =
        farmers.find(
            item =>
                item.farmerId == id
        );

    if (!farmer) {
        return;
    }

    document.getElementById(
        "farmerId"
    ).value =
        farmer.farmerId;

    document.getElementById(
        "name"
    ).value =
        farmer.name;

    document.getElementById(
        "age"
    ).value =
        farmer.age;

    document.getElementById(
        "gender"
    ).value =
        farmer.gender;

    document.getElementById(
        "phone"
    ).value =
        farmer.phone;

    document.getElementById(
        "village"
    ).value =
        farmer.village;

    document.getElementById(
        "district"
    ).value =
        farmer.district;

    document.getElementById(
        "landOwnership"
    ).value =
        farmer.landOwnership;


    document.getElementById(
        "formTitle"
    ).innerText =
        "Update Farmer";


    document.getElementById(
        "cancelBtn"
    ).classList.remove(
        "hidden"
    );


    window.scrollTo(
        0,
        0
    );
}


// =====================================
// CANCEL UPDATE
// =====================================

function cancelUpdate() {

    document
        .getElementById(
            "farmerForm"
        )
        .reset();

    document
        .getElementById(
            "farmerId"
        )
        .value = "";

    document
        .getElementById(
            "formTitle"
        )
        .innerText =
        "Add Farmer";

    document
        .getElementById(
            "cancelBtn"
        )
        .classList.add(
            "hidden"
        );
}


// =====================================
// DELETE FARMER
// =====================================

async function deleteFarmer(id) {

    if (!confirm(
        "Are you sure you want to delete this farmer?"
    )) {
        return;
    }

    try {

        const response =
            await fetch(
                "/deleteFarmer?id=" + id,
                {
                    method: "POST"
                }
            );

        const result =
            await response.text();

        alert(result);

        loadFarmers();

    } catch (error) {

        console.error(error);

        alert(
            "Error deleting farmer."
        );
    }
}


// =====================================
// INITIAL LOAD
// =====================================

loadFarmers();
function searchFarmers() {

    let search =
        document.getElementById("farmerSearch")
        .value
        .toLowerCase();

    let filtered = farmers.filter(farmer =>
        String(farmer.name).toLowerCase().includes(search) ||
        String(farmer.village).toLowerCase().includes(search) ||
        String(farmer.district).toLowerCase().includes(search) ||
        String(farmer.phone).toLowerCase().includes(search)
    );

    displayFarmers(filtered);
}
async function loadPreviousCrops() {

    try {

        const response = await fetch("/getPreviousCrops");

        const data = await response.json();

        const table =
            document.getElementById("previousCropTable");

        table.innerHTML = "";

        data.forEach(record => {

            table.innerHTML += `
                <tr>
                    <td>${record.recordId}</td>
                    <td>${record.farmerId}</td>
                    <td>${record.farmerName}</td>
                    <td>${record.landId}</td>
                    <td>${record.cropId}</td>
                    <td>${record.cropName}</td>
                    <td>${record.season}</td>
                    <td>${record.year}</td>
                    <td>${record.yield}</td>
                    <td>
                        <button onclick="deletePreviousCrop(${record.recordId})">
                            Delete
                        </button>
                    </td>
                </tr>
            `;

        });

    } catch (error) {

        console.error(error);

    }
}


async function deletePreviousCrop(id) {

    if (!confirm("Delete this previous crop record?")) {
        return;
    }

    const response =
        await fetch("/deletePreviousCrop?id=" + id, {
            method: "POST"
        });

    const message = await response.text();

    alert(message);

    loadPreviousCrops();
}


document.getElementById("previousCropForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const data = new URLSearchParams();

    data.append(
        "farmerId",
        document.getElementById("previousFarmerId").value
    );

    data.append(
        "landId",
        document.getElementById("previousLandId").value
    );

    data.append(
        "cropId",
        document.getElementById("previousCropId").value
    );

    data.append(
        "season",
        document.getElementById("previousSeason").value
    );

    data.append(
        "year",
        document.getElementById("previousYear").value
    );

    data.append(
        "yield",
        document.getElementById("previousYield").value
    );

    const response =
        await fetch("/addPreviousCrop", {
            method: "POST",
            headers: {
                "Content-Type":
                    "application/x-www-form-urlencoded"
            },
            body: data
        });

    const message = await response.text();

    alert(message);

    this.reset();

    loadPreviousCrops();

});
</script>

</body>

</html>
